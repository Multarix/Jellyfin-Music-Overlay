<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="./style.css">
		<script defer src="./script.js"></script>

		<title>Jellyfin Music Player</title>
	</head>
	<body>
		<div id="music-player" class="music_player" style="transform: translateY(200px)">
			<div id="player-bg" style="background-image: url(./unknown.png)"></div>
			<div class="content">
				<div class="song_data">
					<img id="album_art" src="./unknown.png">
			
					<div id="song_info" class="song_info">
						<div id="song_name">Unknown Song</div>
						<div id="artist_name">Unknown Artist</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
